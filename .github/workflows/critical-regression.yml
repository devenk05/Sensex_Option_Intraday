name: Critical regression tests

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/live-5m-decision-runtime"
  pull_request:
    branches:
      - main

jobs:
  critical-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile project Python files
        run: python -m compileall -q Entry exit report tests
      - name: Run available critical regression tests
        run: >-
          python -m pytest -q
          tests/test_risk_manager.py
          tests/test_entry_confirmation.py
          tests/test_active_trade_manager.py
          tests/test_trade_decision_flow.py
          tests/test_trade_persistence.py
          tests/test_trade_exit_lifecycle.py
          tests/test_telegram_outbox.py
          tests/test_dashboard_generation.py
