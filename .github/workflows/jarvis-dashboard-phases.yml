name: JARVIS Dashboard Phases 2-8
on:
  pull_request:
    branches: [main, integration/dashboard-phases]
  push:
    branches: [main, integration/dashboard-phases, feature/jarvis-phases-2-8]
permissions:
  contents: read
jobs:
  dashboard-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test JARVIS dashboard helpers
        run: node --test tests/dashboard_phases.test.cjs tests/jarvis_cartoon_animation.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile project Python modules
        run: python -m compileall -q Entry AgenticAI MarketData PostMarket exit report scripts
      - name: Run project regression tests
        env:
          PYTHONPATH: Entry:.:exit:report
        run: python -m pytest -q test tests test_nearby_strike_reversal_integration.py
