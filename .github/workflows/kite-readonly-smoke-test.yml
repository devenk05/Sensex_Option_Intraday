name: Read-only Kite and optional Telegram smoke test

on:
  workflow_dispatch:
    inputs:
      send_telegram_test:
        description: "Send one test message to the configured Telegram chat"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  connectivity-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kite client
        run: python -m pip install --upgrade pip kiteconnect

      - name: Verify Kite authentication and SENSEX quote (read-only)
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: python scripts/kite_readonly_smoke_test.py

      - name: Verify Telegram delivery (explicit opt-in)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM_TEST: ${{ inputs.send_telegram_test }}
        run: python scripts/telegram_delivery_smoke_test.py
