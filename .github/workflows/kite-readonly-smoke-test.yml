name: Read-only Kite smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kite-readonly-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kite client
        run: python -m pip install --upgrade pip kiteconnect

      - name: Verify Kite authentication and SENSEX quote (read-only)
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: python scripts/kite_readonly_smoke_test.py
